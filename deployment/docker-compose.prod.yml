# Menlo Production Docker Compose Configuration
# For a Linux host running Docker or Podman, next to the VM's llama.cpp server (see ADR-004)

version: '3.8'

services:
  menlo-api:
    image: ghcr.io/digibanks99/menlo/menlo-api:latest
    container_name: menlo-api
    restart: unless-stopped
    # Host networking so the API reaches llama-server on the host loopback without
    # opening it to containers; listen on loopback only (cloudflared is the only client)
    network_mode: host
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://127.0.0.1:8080
      # Trust X-Forwarded-* only from loopback, where cloudflared's requests arrive
      - ForwardedHeaders__KnownNetworks__0=127.0.0.0/8
      - ConnectionStrings__menlo=Host=127.0.0.1;Database=${POSTGRES_DB:-menlo};Username=${POSTGRES_USER:-menlo};Password=${POSTGRES_PASSWORD};SSL Mode=Disable
      # The VM's llama.cpp server (shared with the knowledge base), base URL including /v1. No API key
      - Menlo__AI__Endpoint=${MENLO_AI_ENDPOINT:-http://127.0.0.1:9931/v1}
      - Menlo__AI__ChatModel=${MENLO_AI_CHAT_MODEL:-qwen3.5-4b}
      - Menlo__AI__VisionModel=${MENLO_AI_VISION_MODEL:-qwen3.5-4b}
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.AspNetCore=Warning
      - Logging__LogLevel__Microsoft.SemanticKernel=Information
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - menlo_logs:/app/logs

  postgres:
    image: postgres:17
    container_name: menlo-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-menlo}
      - POSTGRES_USER=${POSTGRES_USER:-menlo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/var/backups/postgresql
    # Loopback only: the API reaches it from the host network
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - menlo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-menlo} -d ${POSTGRES_DB:-menlo}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  db-backup:
    image: prodrigestivill/postgres-backup-local:17
    container_name: menlo-db-backup
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-menlo}
      - POSTGRES_USER=${POSTGRES_USER:-menlo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=${BACKUP_SCHEDULE:-@daily}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-7}
      - BACKUP_KEEP_WEEKS=0
      - BACKUP_KEEP_MONTHS=0
      - HEALTHCHECK_PORT=8080
    volumes:
      - postgres_backups:/backups
    networks:
      - menlo-network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  # Persistent data volumes
  postgres_data:
    name: menlo_postgres_data
    driver: local

  postgres_backups:
    name: menlo_postgres_backups
    driver: local

  menlo_logs:
    name: menlo_logs
    driver: local

networks:
  menlo-network:
    name: menlo_network
    driver: bridge

# Configuration notes:
#
# Environment Variables:
# - POSTGRES_USER: Database username (default: menlo)
# - POSTGRES_PASSWORD: Database password (REQUIRED)
# - POSTGRES_DB: Database name (default: menlo)
# - BACKUP_SCHEDULE: Backup cron schedule (default: @daily)
# - BACKUP_KEEP_DAYS: Number of daily backups to retain (default: 7)
# - MENLO_AI_ENDPOINT: llama.cpp base URL including /v1 (default: http://127.0.0.1:9931/v1)
# - MENLO_AI_CHAT_MODEL / MENLO_AI_VISION_MODEL: llama.cpp preset names (default: qwen3.5-4b)
#
# Volume Locations:
# - Docker: /var/lib/docker/volumes/<name>/_data
# - Rootless Podman: ~/.local/share/containers/storage/volumes/<name>
# Volume names: menlo_postgres_data, menlo_postgres_backups, menlo_logs
