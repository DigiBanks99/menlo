name: Bug
description: Menlo, or a doc, contradicts the intended behaviour.
labels: ['bug']
body:
    - type: markdown
      attributes:
          value: |
              A bug is where Menlo, or a doc, doesn't do or say what is intended. Fixing it restores the intent. If the fix would change intended behaviour, open a Spec instead.
              It is ready to pick up when it meets the Definition of Ready for bugs and tech debt in [Work Items](https://github.com/DigiBanks99/menlo/blob/main/docs/reference/work-items.md#bugs-and-tech-debt-1).
    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: What happens, where, and how to reproduce it.
      validations:
          required: true
    - type: textarea
      id: expected
      attributes:
          label: Expected
          description: What should happen instead, and where that intent is recorded (a doc, a Requirement, a test).
      validations:
          required: true
    - type: textarea
      id: done-when
      attributes:
          label: Done when
          placeholder: |
              - A test fails without the fix and passes with it.
              - ...
      validations:
          required: true
    - type: textarea
      id: affected-areas
      attributes:
          label: Affected areas
          description: Projects, files, endpoints and screens this touches.
      validations:
          required: true
    - type: textarea
      id: open-questions
      attributes:
          label: Open questions
          description: Anything still to decide. An issue with open questions stays in Refining.
