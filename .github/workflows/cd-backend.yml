name: CD - Deploy Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'src/api/**'
      - 'src/lib/**'
      - 'Menlo.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/cd-backend.yml'
      - 'Dockerfile'
      - 'infra/**'
  workflow_dispatch:
    inputs:
      deploy-infra:
        description: 'Deploy infrastructure before backend'
        required: false
        default: false
        type: boolean

env:
  DOTNET_VERSION: '10.0.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/menlo-api
  KEY_VAULT_NAME: kv-menlo-prod
  CERTIFICATE_NAME: menlo-cd-cert

jobs:
  # ============================================================================
  # Infrastructure Deployment (Optional)
  # ============================================================================
  # Only runs on workflow_dispatch with deploy-infra=true or when infra/ changes

  deploy-infrastructure:
    name: Deploy Infrastructure
    if: |
      github.event_name == 'workflow_dispatch' && inputs.deploy-infra == true ||
      contains(github.event.head_commit.modified, 'infra/')
    uses: ./.github/workflows/cd-infra.yml
    with:
      environment: Production
    secrets: inherit

    permissions:
      id-token: write
      contents: read

  # ============================================================================
  # Build and Push Container
  # ============================================================================

  build-and-push:
    name: Build and Push Container
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ============================================================================
  # Download Certificate from Key Vault
  # ============================================================================
  # Downloads the certificate for use by the home server deployment

  download-certificate:
    name: Download Certificate
    runs-on: ubuntu-latest
    needs: [build-and-push]

    permissions:
      id-token: write
      contents: read

    outputs:
      certificate-path: ${{ steps.download.outputs.certificate-path }}
      certificate-thumbprint: ${{ steps.download.outputs.thumbprint }}

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download Certificate from Key Vault
        id: download
        uses: azure/cli@v3
        with:
          azcliversion: latest
          inlineScript: |
            echo "🔐 Downloading certificate from Key Vault..."

            # Download the certificate (PFX format with private key)
            az keyvault secret download \
              --vault-name "${{ env.KEY_VAULT_NAME }}" \
              --name "${{ env.CERTIFICATE_NAME }}" \
              --encoding base64 \
              --file cert.pfx

            # Get the thumbprint
            THUMBPRINT=$(az keyvault certificate show \
              --vault-name "${{ env.KEY_VAULT_NAME }}" \
              --name "${{ env.CERTIFICATE_NAME }}" \
              --query "x509ThumbprintHex" \
              --output tsv)

            echo "✅ Certificate downloaded successfully"
            echo "   Thumbprint: $THUMBPRINT"

            echo "thumbprint=$THUMBPRINT" >> "$GITHUB_OUTPUT"

            # The certificate will be passed to the next job via artifact
            echo "certificate-path=cert.pfx" >> "$GITHUB_OUTPUT"

      - name: Upload Certificate Artifact
        uses: actions/upload-artifact@v7
        with:
          name: certificate
          path: cert.pfx
          retention-days: 1
          if-no-files-found: error

  # ============================================================================
  # Deploy to Home Server
  # ============================================================================

  deploy-to-home-server:
    name: Deploy to Home Server
    runs-on: [self-hosted, menlo-deploy]
    needs: [build-and-push, download-certificate]
    if: github.ref == 'refs/heads/main' && github.repository == 'DigiBanks99/menlo'
    environment:
      name: 'Production'

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deployment/

      - name: Download Certificate Artifact
        uses: actions/download-artifact@v8
        with:
          name: certificate
          path: ${{ runner.temp }}/cert

      - name: Deploy application
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
          CERTIFICATE_THUMBPRINT: ${{ needs.download-certificate.outputs.certificate-thumbprint }}
          CERTIFICATE_PATH: ${{ runner.temp }}/cert/cert.pfx
          AZURE_AD_INSTANCE: ${{ vars.AZURE_AD_INSTANCE }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_PROD }}
          FEATURES_BUDGET: ${{ vars.FEATURES_BUDGET || 'true' }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: menlo
        run: |
          set -euo pipefail

          echo "🚀 Starting Menlo deployment..."

          # Extract the first tag (main image tag) from the multi-line output
          IMAGE_TAG_CLEAN=$(printf '%s\n' "$IMAGE_TAG" | head -n1 | xargs)
          echo "📦 Using image: $IMAGE_TAG_CLEAN"

          # Prefer Podman, fall back to Docker
          if command -v podman >/dev/null 2>&1; then
            RUNTIME=podman
          elif command -v docker >/dev/null 2>&1; then
            RUNTIME=docker
          else
            echo "::error::Neither podman nor docker is installed on the deploy host"
            exit 1
          fi
          echo "🐳 Using container runtime: $RUNTIME"

          # Application paths
          APP_PATH="$HOME/menlo"
          mkdir -p "$APP_PATH"
          cd "$APP_PATH"

          # Encode certificate as Base64 for passing to container
          echo "📜 Encoding certificate..."
          CERT_BASE64=$(base64 -w0 "$CERTIFICATE_PATH")

          # Create docker-compose.prod.yml (contains secrets, so keep it owner-only)
          umask 077
          cat > docker-compose.prod.yml <<EOF
          services:
            menlo-api:
              image: ${IMAGE_TAG_CLEAN}
              container_name: menlo-api
              restart: unless-stopped
              environment:
                - ASPNETCORE_ENVIRONMENT=Production
                - ASPNETCORE_URLS=http://+:8080
                - ConnectionStrings__menlo=Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};SSL Mode=Disable
                - Ollama__BaseUrl=http://ollama:11434
                - Logging__LogLevel__Default=Information
                - Features__Budget=${FEATURES_BUDGET}
                - AzureAd__Instance=${AZURE_AD_INSTANCE}
                - AzureAd__TenantId=${AZURE_AD_TENANT_ID}
                - AzureAd__ClientId=${AZURE_AD_CLIENT_ID}
                - AzureAd__ClientCertificates__0__SourceType=Base64Encoded
                - AzureAd__ClientCertificates__0__Base64EncodedValue=${CERT_BASE64}
              ports:
                - "8080:8080"
              networks:
                - menlo-network
              depends_on:
                - postgres
                - ollama
              healthcheck:
                test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 40s

            postgres:
              image: postgres:17
              container_name: menlo-postgres
              restart: unless-stopped
              environment:
                - POSTGRES_DB=${POSTGRES_DB}
                - POSTGRES_USER=${POSTGRES_USER}
                - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
              volumes:
                - postgres_data:/var/lib/postgresql/data
              ports:
                - "5432:5432"
              networks:
                - menlo-network
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
                interval: 30s
                timeout: 10s
                retries: 5

            ollama:
              image: ollama/ollama:latest
              container_name: menlo-ollama
              restart: unless-stopped
              volumes:
                - ollama_data:/root/.ollama
              ports:
                - "11434:11434"
              networks:
                - menlo-network
              environment:
                - OLLAMA_KEEP_ALIVE=24h
                - OLLAMA_NUM_PARALLEL=2
              healthcheck:
                test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
                interval: 60s
                timeout: 30s
                retries: 3
                start_period: 120s

          volumes:
            postgres_data:
              name: menlo_postgres_data
            ollama_data:
              name: menlo_ollama_data

          networks:
            menlo-network:
              name: menlo_network
              driver: bridge
          EOF

          # Pull new image
          echo "📥 Pulling new image..."
          "$RUNTIME" pull "$IMAGE_TAG_CLEAN"

          # Stop existing services
          echo "⏸️ Stopping existing services..."
          "$RUNTIME" compose -f docker-compose.prod.yml down 2>/dev/null || true

          # Start services
          echo "▶️ Starting services..."
          "$RUNTIME" compose -f docker-compose.prod.yml up -d

          # Wait for health checks
          echo "🏥 Waiting for services..."
          sleep 30

          # Check service status
          echo "📊 Service Status:"
          "$RUNTIME" compose -f docker-compose.prod.yml ps

          echo "✅ Deployment completed!"

      - name: Verify deployment
        shell: bash
        run: |
          echo "🔍 Verifying deployment..."
          sleep 30

          # Test API health
          for i in {1..5}; do
            if curl -fsS --max-time 5 -o /dev/null http://localhost:8080/health; then
              echo "✅ API health check passed"
              exit 0
            fi
            echo "⏳ API not ready yet... ($i/5)"
            sleep 10
          done

          echo "::error::API health check failed after 5 attempts"
          exit 1

      - name: Update Cloudflare Tunnel
        if: vars.CLOUDFLARE_TUNNEL_ENABLED == 'true'
        shell: bash
        run: |
          echo "🌐 Restarting Cloudflare Tunnel..."
          # Restart the cloudflared systemd service if it is installed
          if ! systemctl cat cloudflared.service >/dev/null 2>&1; then
            echo "⚠️ Cloudflare Tunnel service not found"
          elif sudo -n systemctl restart cloudflared; then
            echo "✅ Cloudflare Tunnel restarted"
          else
            echo "::warning::Failed to restart Cloudflare Tunnel (does the runner user have passwordless sudo for systemctl restart cloudflared?)"
          fi

  post-deployment:
    name: Post-Deployment Checks
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-to-home-server]
    if: success()

    steps:
      - name: External health check
        run: |
          echo "🏥 Running external health check..."

          if [[ -n "${{ vars.DOMAIN }}" && -n "${{ vars.SUBDOMAIN }}" ]]; then
            API_URL="https://${{ vars.SUBDOMAIN }}.${{ vars.DOMAIN }}"

            # Wait for Cloudflare tunnel to stabilize
            sleep 60

            # Check external API health
            for i in {1..3}; do
              if curl -f "$API_URL/health" -H "User-Agent: GitHub-Actions-Health-Check" -s; then
                echo "✅ External API health check passed for $API_URL"
                break
              else
                echo "⏳ External API at $API_URL not ready yet... ($i/3)"
                sleep 30
              fi
            done
          elif [[ -n "${{ vars.API_BASE_URL }}" ]]; then
            # Fallback to legacy API_BASE_URL variable
            sleep 60

            # Check external API health
            for i in {1..3}; do
              if curl -f "${{ vars.API_BASE_URL }}/health" -H "User-Agent: GitHub-Actions-Health-Check" -s; then
                echo "✅ External API health check passed"
                break
              else
                echo "⏳ External API not ready yet... ($i/3)"
                sleep 30
              fi
            done
          else
            echo "⚠️ Domain variables (DOMAIN, SUBDOMAIN) or API_BASE_URL not configured, skipping external health check"
          fi

      - name: Deployment summary
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          # Extract the first tag (main image tag) from the multi-line output
          IMAGE_TAG_CLEAN=$(echo "$IMAGE_TAG" | head -n1 | xargs)

          echo "### 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Home" >> $GITHUB_STEP_SUMMARY
          echo "- **Server**: ${{ secrets.HOME_SERVER_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: $IMAGE_TAG_CLEAN" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed By**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY

          if [[ -n "${{ vars.DOMAIN }}" && -n "${{ vars.SUBDOMAIN }}" ]]; then
            echo "- **External URL**: https://${{ vars.SUBDOMAIN }}.${{ vars.DOMAIN }}" >> $GITHUB_STEP_SUMMARY
          elif [[ -n "${{ vars.API_BASE_URL }}" ]]; then
            echo "- **External URL**: ${{ vars.API_BASE_URL }}" >> $GITHUB_STEP_SUMMARY
          fi
