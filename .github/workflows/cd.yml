name: CD

# Deploys the image CI built and pushed for a commit on main (sha-<full commit sha>).
# CD never builds images; re-running it for an older commit is the rollback path.
on:
  workflow_run:
    workflows: [ 'CI - Build and Test' ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full commit SHA on main to deploy (leave empty to redeploy the current production image)'
        required: false
        type: string
      deploy-infra:
        description: 'Deploy infrastructure before backend'
        required: false
        default: false
        type: boolean

# Never run two production deploys at once; queue the newer one instead
concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/menlo-api
  KEY_VAULT_NAME: kv-menlo-prod
  CERTIFICATE_NAME: menlo-cd-cert

jobs:
  # ============================================================================
  # Resolve Image
  # ============================================================================
  # Finds the image CI pushed for the commit. A CI run that built no image
  # (e.g. docs-only changes) skips the deploy; a manual run for a SHA with no
  # image fails.

  resolve-image:
    name: Resolve Image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')

    permissions:
      packages: read

    outputs:
      image: ${{ steps.resolve.outputs.image }}
      exists: ${{ steps.resolve.outputs.exists }}
      sha: ${{ steps.resolve.outputs.sha }}

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image for commit
        id: resolve
        shell: bash
        env:
          SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ -z "$SHA" && "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # No SHA given: redeploy the image currently in production
            IMAGE="${REGISTRY}/${IMAGE_NAME,,}:main"
          elif [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            IMAGE="${REGISTRY}/${IMAGE_NAME,,}:sha-${SHA}"
          else
            echo "::error::Expected a full 40-character commit SHA, got '$SHA'"
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "✅ Found $IMAGE"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "::error::No image $IMAGE; CI only pushes images for commits on main that change the image"
            exit 1
          else
            echo "::notice::CI built no image for $SHA, skipping deployment"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================================
  # Infrastructure Deployment (Optional)
  # ============================================================================
  # Only runs on workflow_dispatch with deploy-infra=true
  # Jobs that call a reusable workflow can't set timeout-minutes; cd-infra.yml sets its own

  deploy-infrastructure:
    name: Deploy Infrastructure
    if: github.event_name == 'workflow_dispatch' && inputs.deploy-infra == true
    uses: ./.github/workflows/cd-infra.yml
    with:
      environment: Production
    secrets: inherit

    permissions:
      id-token: write
      contents: read

  # ============================================================================
  # Download Certificate from Key Vault
  # ============================================================================
  # Downloads the certificate for use by the home server deployment

  download-certificate:
    name: Download Certificate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [resolve-image, deploy-infrastructure]
    # Run after an optional infra deploy, but not when it was skipped for being unrequested
    if: |
      always() && needs.resolve-image.outputs.exists == 'true' &&
      (needs.deploy-infrastructure.result == 'success' || needs.deploy-infrastructure.result == 'skipped')

    permissions:
      id-token: write
      contents: read

    outputs:
      certificate-path: ${{ steps.download.outputs.certificate-path }}
      certificate-thumbprint: ${{ steps.download.outputs.thumbprint }}

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download Certificate from Key Vault
        id: download
        uses: azure/cli@v3
        with:
          azcliversion: latest
          inlineScript: |
            echo "🔐 Downloading certificate from Key Vault..."

            # Download the certificate (PFX format with private key)
            az keyvault secret download \
              --vault-name "${{ env.KEY_VAULT_NAME }}" \
              --name "${{ env.CERTIFICATE_NAME }}" \
              --encoding base64 \
              --file cert.pfx

            # Get the thumbprint
            THUMBPRINT=$(az keyvault certificate show \
              --vault-name "${{ env.KEY_VAULT_NAME }}" \
              --name "${{ env.CERTIFICATE_NAME }}" \
              --query "x509ThumbprintHex" \
              --output tsv)

            echo "✅ Certificate downloaded successfully"
            echo "   Thumbprint: $THUMBPRINT"

            echo "thumbprint=$THUMBPRINT" >> "$GITHUB_OUTPUT"

            # The certificate will be passed to the next job via artifact
            echo "certificate-path=cert.pfx" >> "$GITHUB_OUTPUT"

      - name: Upload Certificate Artifact
        uses: actions/upload-artifact@v7
        with:
          name: certificate
          path: cert.pfx
          retention-days: 1
          if-no-files-found: error

  # ============================================================================
  # Deploy to Home Server
  # ============================================================================

  deploy-to-home-server:
    name: Deploy to Home Server
    runs-on: [self-hosted, menlo-deploy]
    # Self-hosted jobs otherwise run for up to 5 days and hold the deploy concurrency group
    timeout-minutes: 20
    needs: [resolve-image, download-certificate]
    # Explicit result checks: a skipped deploy-infrastructure upstream would otherwise skip this job
    if: |
      !cancelled() && needs.download-certificate.result == 'success' &&
      github.ref == 'refs/heads/main' && github.repository == 'DigiBanks99/menlo'
    environment:
      name: 'Production'

    steps:
      - name: Download Certificate Artifact
        uses: actions/download-artifact@v8
        with:
          name: certificate
          path: ${{ runner.temp }}/cert

      - name: Deploy application
        shell: bash
        timeout-minutes: 15
        env:
          IMAGE: ${{ needs.resolve-image.outputs.image }}
          CERTIFICATE_THUMBPRINT: ${{ needs.download-certificate.outputs.certificate-thumbprint }}
          CERTIFICATE_PATH: ${{ runner.temp }}/cert/cert.pfx
          AZURE_AD_INSTANCE: ${{ vars.AZURE_AD_INSTANCE }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_PROD }}
          FEATURES_BUDGET: ${{ vars.FEATURES_BUDGET || 'true' }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: menlo
          CONTAINER_RUNTIME: ${{ vars.CONTAINER_RUNTIME }}
        run: |
          set -euo pipefail

          echo "🚀 Starting Menlo deployment..."

          echo "📦 Using image: $IMAGE"

          # Use CONTAINER_RUNTIME (docker or podman) when set, otherwise
          # detect what is installed, preferring Podman
          RUNTIME="${CONTAINER_RUNTIME:-}"
          if [[ -z "$RUNTIME" ]]; then
            if command -v podman >/dev/null 2>&1; then
              RUNTIME=podman
            elif command -v docker >/dev/null 2>&1; then
              RUNTIME=docker
            else
              echo "::error::Neither podman nor docker is installed on the deploy host"
              exit 1
            fi
          elif [[ "$RUNTIME" != "docker" && "$RUNTIME" != "podman" ]]; then
            echo "::error::CONTAINER_RUNTIME must be 'docker' or 'podman', got '$RUNTIME'"
            exit 1
          elif ! command -v "$RUNTIME" >/dev/null 2>&1; then
            echo "::error::CONTAINER_RUNTIME is '$RUNTIME' but it is not installed on the deploy host"
            exit 1
          fi
          echo "🐳 Using container runtime: $RUNTIME"

          # Application paths
          APP_PATH="$HOME/menlo"
          mkdir -p "$APP_PATH"
          cd "$APP_PATH"

          # Encode certificate as Base64 for passing to container
          echo "📜 Encoding certificate..."
          CERT_BASE64=$(base64 -w0 "$CERTIFICATE_PATH")

          # Create docker-compose.prod.yml (contains secrets, so keep it owner-only)
          umask 077
          cat > docker-compose.prod.yml <<EOF
          services:
            menlo-api:
              image: ${IMAGE}
              container_name: menlo-api
              restart: unless-stopped
              environment:
                - ASPNETCORE_ENVIRONMENT=Production
                - ASPNETCORE_URLS=http://+:8080
                - ConnectionStrings__menlo=Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};SSL Mode=Disable
                - Ollama__BaseUrl=http://ollama:11434
                - Logging__LogLevel__Default=Information
                - Features__Budget=${FEATURES_BUDGET}
                - AzureAd__Instance=${AZURE_AD_INSTANCE}
                - AzureAd__TenantId=${AZURE_AD_TENANT_ID}
                - AzureAd__ClientId=${AZURE_AD_CLIENT_ID}
                - AzureAd__ClientCertificates__0__SourceType=Base64Encoded
                - AzureAd__ClientCertificates__0__Base64EncodedValue=${CERT_BASE64}
              ports:
                - "8080:8080"
              networks:
                - menlo-network
              depends_on:
                - postgres
                - ollama
              healthcheck:
                test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 40s

            postgres:
              image: postgres:17
              container_name: menlo-postgres
              restart: unless-stopped
              environment:
                - POSTGRES_DB=${POSTGRES_DB}
                - POSTGRES_USER=${POSTGRES_USER}
                - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
              volumes:
                - postgres_data:/var/lib/postgresql/data
              ports:
                - "5432:5432"
              networks:
                - menlo-network
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
                interval: 30s
                timeout: 10s
                retries: 5

            ollama:
              image: ollama/ollama:latest
              container_name: menlo-ollama
              restart: unless-stopped
              volumes:
                - ollama_data:/root/.ollama
              ports:
                - "11434:11434"
              networks:
                - menlo-network
              environment:
                - OLLAMA_KEEP_ALIVE=24h
                - OLLAMA_NUM_PARALLEL=2
              healthcheck:
                test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
                interval: 60s
                timeout: 30s
                retries: 3
                start_period: 120s

          volumes:
            postgres_data:
              name: menlo_postgres_data
            ollama_data:
              name: menlo_ollama_data

          networks:
            menlo-network:
              name: menlo_network
              driver: bridge
          EOF

          # Pull new image
          echo "📥 Pulling new image..."
          "$RUNTIME" pull "$IMAGE"

          # Stop existing services
          echo "⏸️ Stopping existing services..."
          "$RUNTIME" compose -f docker-compose.prod.yml down 2>/dev/null || true

          # Start services
          echo "▶️ Starting services..."
          "$RUNTIME" compose -f docker-compose.prod.yml up -d

          # Wait for health checks
          echo "🏥 Waiting for services..."
          sleep 30

          # Check service status
          echo "📊 Service Status:"
          "$RUNTIME" compose -f docker-compose.prod.yml ps

          echo "✅ Deployment completed!"

      - name: Verify deployment
        shell: bash
        timeout-minutes: 5
        run: |
          echo "🔍 Verifying deployment..."
          sleep 30

          # Test API health
          for i in {1..5}; do
            if curl -fsS --max-time 5 -o /dev/null http://localhost:8080/health; then
              echo "✅ API health check passed"
              exit 0
            fi
            echo "⏳ API not ready yet... ($i/5)"
            sleep 10
          done

          echo "::error::API health check failed after 5 attempts"
          exit 1

      - name: Update Cloudflare Tunnel
        if: vars.CLOUDFLARE_TUNNEL_ENABLED == 'true'
        shell: bash
        timeout-minutes: 2
        run: |
          echo "🌐 Restarting Cloudflare Tunnel..."
          # Restart the cloudflared systemd service if it is installed
          if ! systemctl cat cloudflared.service >/dev/null 2>&1; then
            echo "⚠️ Cloudflare Tunnel service not found"
          elif sudo -n systemctl restart cloudflared; then
            echo "✅ Cloudflare Tunnel restarted"
          else
            echo "::warning::Failed to restart Cloudflare Tunnel (does the runner user have passwordless sudo for systemctl restart cloudflared?)"
          fi

  post-deployment:
    name: Post-Deployment Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [resolve-image, deploy-to-home-server]
    if: ${{ !cancelled() && needs.deploy-to-home-server.result == 'success' }}

    # Moves the main tag to the image that is now in production
    permissions:
      packages: write

    steps:
      - name: Checkout smoke check
        uses: actions/checkout@v7
        with:
          sparse-checkout: deployment/smoke-check.sh
          sparse-checkout-cone-mode: false

      # Runs before the retag below, so a failing smoke check leaves the main tag on the previous image
      - name: Smoke check production
        shell: bash
        env:
          APP_URL: ${{ vars.FRONTEND_URL }}
        run: |
          if [[ -z "$APP_URL" ]]; then
            echo "::error::FRONTEND_URL is not set; it must be the production URL the smoke check runs against"
            exit 1
          fi
          bash deployment/smoke-check.sh "$APP_URL" 180

      - name: Rollback hint
        if: failure()
        shell: bash
        run: |
          echo "::error::Production failed its smoke check. The main tag still points at the previous image; roll back with: gh workflow run cd.yml --ref main"

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag deployed image as main
        env:
          IMAGE: ${{ needs.resolve-image.outputs.image }}
        run: |
          MAIN_TAG="${IMAGE%:*}:main"
          if [[ "$IMAGE" == "$MAIN_TAG" ]]; then
            echo "Redeployed $MAIN_TAG, nothing to retag"
            exit 0
          fi
          docker buildx imagetools create --tag "$MAIN_TAG" "$IMAGE"
          echo "🏷️ $MAIN_TAG -> $IMAGE"

      - name: Deployment summary
        env:
          IMAGE_TAG_CLEAN: ${{ needs.resolve-image.outputs.image }}
        run: |

          echo "### 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Home" >> $GITHUB_STEP_SUMMARY
          echo "- **Server**: ${{ secrets.HOME_SERVER_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: $IMAGE_TAG_CLEAN" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed By**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY

          echo "- **External URL**: ${{ vars.FRONTEND_URL }}" >> $GITHUB_STEP_SUMMARY
