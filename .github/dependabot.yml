version: 2
updates:
  # .NET Dependencies
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "02:00"
    # Wait before proposing fresh releases (security updates bypass cooldown)
    cooldown:
      default-days: 3
    # Group minor and patch updates to reduce PR noise
    groups:
      dotnet-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Allow up to 10 open PRs (default is 5)
    open-pull-requests-limit: 10
    # Ignore major version updates for stability
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Aspire packages must move with the AppHost SDK version, which Dependabot can't update; use `aspire update`
      - dependency-name: "Aspire.*"

  # GitHub Actions Dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Wait before proposing fresh releases (security updates bypass cooldown)
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]